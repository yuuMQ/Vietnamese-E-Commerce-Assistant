<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Assistant</title>
    <link rel="stylesheet" href="/static/index.css">
</head>

<body>
    <div class="chat-container">
        <div class="chat-header">E-COMMERCE ASSISTANT</div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">Dạ shop chào bạn ạ! Mình có thể giúp gì cho bạn hôm nay ạ?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" class="chat-input" placeholder="Nhập tin nhắn ở đây..."
                onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">Gửi</button>
        </div>
    </div>

    <script src="/static/index.js"></script>
</body>

</html>
